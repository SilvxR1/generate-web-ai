name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR/branch cancels the still-running check for
# the previous one — no point finishing a superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (apps/api)
    runs-on: ubuntu-latest
    # A real Postgres service container — the same engine
    # docker-compose.yml and production use (sqlite is a dev-only
    # fallback, see app.config.Settings) — so "alembic upgrade head"
    # below is a genuine test, not just a sqlite-shaped approximation.
    # Ephemeral, CI-local credentials only; never a real secret.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: generate_web_ai
          POSTGRES_USER: generate_web_ai
          POSTGRES_PASSWORD: generate_web_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U generate_web_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://generate_web_ai:generate_web_ai@localhost:5432/generate_web_ai
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # P2 continuation Part 3 (real browser QA): tests/test_browser_qa.py
      # and tests/test_visual_qa.py launch a real headless Chromium
      # (Playwright's own bundled browser — this is the one that actually
      # launches in a locked-down sandbox, unlike other browser tooling
      # tried during development) against a real generative build's
      # static output. `--with-deps` also installs the system libraries
      # Chromium needs via apt, which GitHub's ubuntu-latest runner allows
      # non-interactively (unlike a local dev sandbox without passwordless
      # sudo).
      - name: Install Playwright Chromium (for real browser + visual QA)
        run: uv run playwright install --with-deps chromium

      # app.publishing.build shells out to a real `pnpm exec astro build`
      # (see its own docstring: "no second renderer, no duplicated
      # blocks") — the site-builder integration tests exercise that real
      # subprocess, not a stand-in, so this job needs the same Node/pnpm
      # toolchain the frontend job has, not just Python.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install monorepo dependencies (for the real astro build the publishing tests run)
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to a fresh database
        run: uv run alembic upgrade head

      - name: Run tests
        # Tests use their own in-memory sqlite session (see
        # tests/conftest.py) regardless of DATABASE_URL — this proves the
        # schema itself (via the migration step above), pytest proves
        # behavior.
        run: uv run pytest -q

      - name: mypy
        run: uv run mypy app/

      - name: ruff
        run: uv run ruff check .

      # Regression check for the exact bug that broke the Railway
      # production deploy after P2 merged: `playwright` was declared
      # dev-only, so the production install (Dockerfile.prod's `uv sync
      # --frozen --no-dev`) never installed it, and app.main crashed at
      # import time (app.routers.creative -> app.publishing.drafts ->
      # app.creative.frontend_engine.visual_qa -> browser_qa's
      # module-level `from playwright.sync_api import sync_playwright`).
      # CI installed Chromium above and every step so far ran against the
      # *full* dev dependency set, so it never caught that Playwright
      # itself was missing from the production subset — this step
      # re-syncs to that exact production subset (must run last in this
      # job: it prunes the dev group pytest/mypy/ruff above still need)
      # and re-proves both the import and a real Chromium launch survive
      # it, closing the CI/production parity gap.
      - name: Verify production-equivalent dependency set can boot the API
        run: |
          uv sync --frozen --no-dev
          uv run --frozen --no-dev python -c "from app.main import app; print('API import OK')"
          uv run --frozen --no-dev python -c "from playwright.sync_api import sync_playwright; print('Playwright import OK')"
          uv run --frozen --no-dev python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--no-sandbox"])
              browser.close()
          print("Chromium launch OK under production dependency set")
          PY

  frontend:
    name: Frontend (pnpm monorepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repo-wide typecheck (turbo run check)
        run: pnpm check

      - name: Repo-wide tests (turbo run test — studio, website-generator, workflow-config-types)
        run: pnpm test

      - name: Build
        run: pnpm build
