[project]
name = "generate-web-ai-api"
version = "0.0.1"
description = "AI Business Automation Studio — backend control plane (domain model, validation, orchestration)."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "cryptography>=42.0",
  "psycopg[binary]>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "anthropic>=0.69",
  "psycopg2-binary>=2.9.12",
  "python-multipart>=0.0.32",
  # CloudflareR2StorageProvider (app.storage.r2, P2.1) — production
  # persistent artifact storage (GenerativeWebsiteArtifact source
  # archives, Visual QA screenshots), replacing LocalStorageProvider's
  # ephemeral Railway disk. R2 is S3-compatible; boto3 (with a custom
  # `endpoint_url`) is the standard, well-tested way to talk to it,
  # preferred here over hand-rolling AWS SigV4 request signing by hand —
  # a correctness-sensitive algorithm not worth re-implementing for one
  # provider. LocalStorageProvider (no boto3 dependency) remains the
  # local/dev/test default; see app.dependencies.get_storage_provider.
  "boto3>=1.34",
  # Real-browser/Visual QA (P2 continuation Part 3/4) is a production
  # feature, invoked from a live request path (POST
  # .../website-drafts/{id}/visual-qa via app.publishing.drafts.
  # run_visual_qa_for_draft) — not a test-only tool, so it belongs here,
  # not in the dev-only group below. It was previously miscategorized as
  # dev-only, which is exactly why `uv sync --frozen --no-dev` (the
  # production install, see Dockerfile.prod) never installed it and
  # Railway crashed on `from playwright.sync_api import sync_playwright`
  # at import time in app.creative.frontend_engine.browser_qa.
  "playwright>=1.62.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not real_provider'"
markers = [
  "real_provider: calls a real external provider (Higgsfield CLI, Anthropic API) and is never run in default CI — see tests/test_frontend_engine_real.py and tests/test_higgsfield_real.py for why these stay opt-in (`pytest -m real_provider`), separate from the default `pytest` invocation used everywhere else.",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern requires `Depends(...)`/
# `File(...)`/`Form(...)` as argument defaults — that's not the
# accidental-mutable-default bug B008 exists to catch.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.params.Depends",
  "fastapi.File",
  "fastapi.params.File",
  "fastapi.Form",
  "fastapi.params.Form",
  "fastapi.Query",
  "fastapi.params.Query",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["migrations/"]
