[project]
name = "generate-web-ai-api"
version = "0.0.1"
description = "AI Business Automation Studio — backend control plane (domain model, validation, orchestration)."
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "cryptography>=42.0",
  "psycopg[binary]>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "anthropic>=0.69",
  "psycopg2-binary>=2.9.12",
  "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern requires `Depends(...)`/
# `File(...)`/`Form(...)` as argument defaults — that's not the
# accidental-mutable-default bug B008 exists to catch.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.params.Depends",
  "fastapi.File",
  "fastapi.params.File",
  "fastapi.Form",
  "fastapi.params.Form",
  "fastapi.Query",
  "fastapi.params.Query",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["migrations/"]
