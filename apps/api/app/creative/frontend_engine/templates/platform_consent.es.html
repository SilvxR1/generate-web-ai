<div id="gwa-consent-banner" data-gwa-platform-consent role="dialog" aria-live="polite" aria-label="Preferencias de cookies" hidden>
<style data-gwa-platform-consent>
#gwa-consent-banner{position:fixed;inset:auto 1rem 1rem 1rem;z-index:2147483000;max-width:40rem;margin:0 auto;padding:1rem 1.25rem;border-radius:var(--gwa-consent-radius,.75rem);background:var(--gwa-consent-bg,#fff);color:var(--gwa-consent-fg,#111);box-shadow:0 8px 30px rgba(0,0,0,.18);font:inherit;font-size:.95rem;line-height:1.45}
#gwa-consent-banner[hidden]{display:none}
#gwa-consent-banner p{margin:0 0 .75rem}
#gwa-consent-banner a{color:inherit;text-decoration:underline}
#gwa-consent-banner .gwa-consent-categories{display:flex;flex-wrap:wrap;gap:.5rem 1rem;margin:0 0 .75rem}
#gwa-consent-banner .gwa-consent-actions{display:flex;flex-wrap:wrap;gap:.5rem}
#gwa-consent-banner button{cursor:pointer;padding:.5rem .9rem;border-radius:.5rem;border:1px solid currentColor;background:transparent;color:inherit;font:inherit}
#gwa-consent-banner #gwa-consent-accept{background:var(--gwa-consent-accent,#111);color:var(--gwa-consent-accent-fg,#fff);border-color:transparent}
#gwa-consent-banner button:focus-visible,#gwa-consent-banner input:focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
<p>Este sitio usa cookies y almacenamiento local. Los necesarios están siempre activos; el resto permanece desactivado salvo que decidas permitirlo. <a href="/cookies">Política de cookies</a></p>
<div class="gwa-consent-categories">
<label><input type="checkbox" checked disabled> Necesarias (siempre activas)</label>
<label><input type="checkbox" data-consent-category="analytics"> Analítica</label>
<label><input type="checkbox" data-consent-category="marketing"> Marketing</label>
<label><input type="checkbox" data-consent-category="preferences"> Preferencias</label>
</div>
<div class="gwa-consent-actions">
<button type="button" id="gwa-consent-reject">Rechazar no esenciales</button>
<button type="button" id="gwa-consent-save">Guardar preferencias</button>
<button type="button" id="gwa-consent-accept">Aceptar todo</button>
</div>
</div>
<script>(function(){var KEY="gwa-consent";function stored(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}function banner(){return document.getElementById("gwa-consent-banner")}function hide(){var b=banner();if(b)b.hidden=true}function show(){var b=banner();if(!b)return;var s=stored();b.querySelectorAll("[data-consent-category]").forEach(function(i){i.checked=!!(s&&s[i.getAttribute("data-consent-category")])});b.hidden=false}function apply(c){if(window.gwaConsent&&window.gwaConsent.set){window.gwaConsent.set(c)}else{var rec={necessary:true,analytics:!!c.analytics,marketing:!!c.marketing,preferences:!!c.preferences,updatedAt:new Date().toISOString()};try{localStorage.setItem(KEY,JSON.stringify(rec))}catch(e){}window.dispatchEvent(new CustomEvent("gwa-consent-change",{detail:rec}))}hide()}function init(){var b=banner();if(!b)return;document.getElementById("gwa-consent-accept").addEventListener("click",function(){apply({analytics:true,marketing:true,preferences:true})});document.getElementById("gwa-consent-reject").addEventListener("click",function(){apply({analytics:false,marketing:false,preferences:false})});document.getElementById("gwa-consent-save").addEventListener("click",function(){var c={};b.querySelectorAll("[data-consent-category]").forEach(function(i){c[i.getAttribute("data-consent-category")]=i.checked});apply(c)});document.querySelectorAll("[data-open-consent-preferences]").forEach(function(t){t.addEventListener("click",function(e){e.preventDefault();show()})});window.addEventListener("gwa-consent-open",show);if(!stored())show()}if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init)}else{init()}})();</script>
