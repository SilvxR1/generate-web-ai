# v0.2 R4.2 — /etc/ssh/sshd_config.d/50-gwa-worker.conf
# Key-only administration. install.sh installs this ONLY after confirming an
# authorized_keys entry exists for root or the invoking sudo user, so the
# owner cannot be locked out, and validates with `sshd -t` before reloading.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
X11Forwarding no
AllowTcpForwarding no
MaxAuthTries 3
